name: Deploy Repartidor + Ticket Scanner 5.7.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare application
        run: |
          set -euo pipefail

          rm -rf public

          mkdir -p public
          mkdir -p public/ocr/core
          mkdir -p public/ocr/lang
          mkdir -p public/src

          cp index.html public/
          cp manifest.json public/
          cp sw.js public/

          if [ -f icon-180.png ]; then
            cp icon-180.png public/
          fi

          if [ -f icon-512.png ]; then
            cp icon-512.png public/
          fi

          if [ -d src ]; then
            cp -R src/. public/src/
          fi

      - name: Download Tesseract engine
        run: |
          set -euo pipefail

          curl --fail --retry 3 -L \
            https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js \
            -o public/ocr/tesseract.min.js

          curl --fail --retry 3 -L \
            https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js \
            -o public/ocr/worker.min.js

      - name: Download Tesseract core
        run: |
          set -euo pipefail

          for f in \
            tesseract-core.wasm.js \
            tesseract-core-simd.wasm.js \
            tesseract-core-lstm.wasm.js \
            tesseract-core-simd-lstm.wasm.js
          do
            curl --fail --retry 3 -L \
              "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1/$f" \
              -o "public/ocr/core/$f"
          done

      - name: Download European languages
        run: |
          set -euo pipefail

          for lang in \
            cat \
            spa \
            eng \
            nld \
            fra \
            deu \
            ita \
            por
          do
            curl --fail --retry 3 -L \
              "https://tessdata.projectnaptha.com/4.0.0/$lang.traineddata.gz" \
              -o "public/ocr/lang/$lang.traineddata.gz"
          done

      - name: Verify OCR assets
        run: |
          set -euo pipefail

          echo "Checking application..."

          test -s public/index.html
          test -s public/manifest.json
          test -s public/sw.js

          echo "Checking Tesseract..."

          test -s public/ocr/tesseract.min.js
          test -s public/ocr/worker.min.js

          echo "Checking Tesseract core..."

          test -s public/ocr/core/tesseract-core.wasm.js
          test -s public/ocr/core/tesseract-core-simd.wasm.js
          test -s public/ocr/core/tesseract-core-lstm.wasm.js
          test -s public/ocr/core/tesseract-core-simd-lstm.wasm.js

          echo "Checking languages..."

          test -s public/ocr/lang/cat.traineddata.gz
          test -s public/ocr/lang/spa.traineddata.gz
          test -s public/ocr/lang/eng.traineddata.gz
          test -s public/ocr/lang/nld.traineddata.gz
          test -s public/ocr/lang/fra.traineddata.gz
          test -s public/ocr/lang/deu.traineddata.gz
          test -s public/ocr/lang/ita.traineddata.gz
          test -s public/ocr/lang/por.traineddata.gz

          echo ""
          echo "OCR ASSETS OK"
          echo ""
          echo "Files that will be published:"
          find public -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
